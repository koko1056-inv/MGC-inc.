name: Daily AI Column

# 業界別AI活用コラムを毎日1本、自動生成して main に公開する。
# 前提: リポジトリの Secrets に GEMINI_API_KEY を登録すること。
#      （任意）Variables に GEMINI_MODEL を設定すると使用モデルを固定できる。
#      未設定時は gemini-3.0-flash → 最新エイリアス → gemini-2.5-flash の順に自動フォールバック。

on:
  schedule:
    - cron: '10 22 * * *'   # 毎日 07:10 JST (22:10 UTC)
  workflow_dispatch: {}       # 手動実行も可（Actions画面から Run workflow）

permissions:
  contents: write

concurrency:
  group: daily-column
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate today's column (Gemini API)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: node scripts/column/generate-column.mjs

      # 新しい記事ができた日だけ、個別のサムネイルを作る（失敗しても公開は止めない。画像が無ければ業種の予備画像）
      - name: Generate thumbnail (Gemini image)
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_IMAGE_MODEL: ${{ vars.GEMINI_IMAGE_MODEL }}
        run: |
          if git diff --quiet -- content/columns/columns.json; then echo "新しい記事なし。スキップ"; exit 0; fi
          npm ci --no-audit --no-fund
          node scripts/column/thumbnail-gemini.mjs --latest

      - name: Build static column pages + sitemap
        run: node scripts/column/build-columns.mjs

      - name: Commit & push to main
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain)" ]; then
            echo "変更なし（生成に失敗した可能性）。コミットせず終了。"
            exit 0
          fi
          slug="$(node -e "const m=require('./content/columns/columns.json');console.log(m.articles[m.articles.length-1].slug)")"
          git add -A
          git commit -m "業界コラム自動投稿: ${slug} ($(TZ=Asia/Tokyo date +%Y-%m-%d))"
          git push
          echo "slug=${slug}" >> "$GITHUB_OUTPUT"

      # 新しい記事を IndexNow で検索エンジン（Bing など）に知らせる。
      # Vercel のデプロイが終わって記事が公開されるのを待ってから送る（失敗しても公開には影響しない）。
      - name: Notify search engines (IndexNow)
        if: steps.commit.outputs.slug != ''
        continue-on-error: true
        run: |
          url="https://mgc-global01.com/column/${{ steps.commit.outputs.slug }}"
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$url")
            [ "$code" = "200" ] && break
            sleep 15
          done
          echo "公開確認: $url → $code"
          node scripts/indexnow.mjs "/column/${{ steps.commit.outputs.slug }}" /column /llms.txt
