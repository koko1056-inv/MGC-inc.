name: Diagnose Selftest (temporary)

# /api/diagnose のGemini呼び出しが本番で全モデル400になる原因を切り分けるための一時的なワークフロー。
# 「正常に動いているGEMINI_API_KEYシークレット」で同じ呼び出しを試し、
# 原因がキーかリクエストの形かを確定させる。切り分けが済んだら削除する。

on:
  workflow_dispatch: {}

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install deps
        run: npm ci

      - name: Run selftest
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/diagnose-selftest.mjs
